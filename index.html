<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAESMI - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">

    <div class="login-container">
        <form class="login-form" id="loginForm">
            <div class="form-header">
                <h2>DAESMI</h2>
                <p>Gestiona tu negocio de forma inteligente</p>
            </div>
            
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" autocomplete="off" placeholder="Ingresa tu usuario" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="error-message" id="errorMessage" hidden>
                Usuario o contraseña incorrectos.
            </div>

            <button type="submit" class="btn-submit">Ingresar</button>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAzW2B3R_TxTojtp8Vw0iS3C2APO2Pmi5A",
            authDomain: "daesmi-8a93c.firebaseapp.com",
            projectId: "daesmi-8a93c",
            storageBucket: "daesmi-8a93c.firebasestorage.app",
            messagingSenderId: "298101414150",
            appId: "1:298101414150:web:294bcf5dd07f18a9cc6687"
        };
        firebase.initializeApp(firebaseConfig);

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            firebase.auth().signInWithEmailAndPassword(user, pass)
                .then(() => {
                    window.location.href = "dashboard.html";
                })
                .catch(() => {
                    errorDiv.hidden = false;
                });
        });
    </script>
    <script>
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                window.location.href = "dashboard.html";
            }
        });
    </script>
</body>
</html>

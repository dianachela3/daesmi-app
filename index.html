<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAESMI - Control de Negocio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col justify-between max-w-md mx-auto shadow-2xl bg-white">

    <header class="bg-purple-800 text-white p-4 sticky top-0 shadow-md flex justify-between items-center rounded-b-2xl">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-purple-300 flex items-center justify-center text-purple-900 font-bold text-sm">D</div>
            <h1 class="text-xl font-bold tracking-wide">DAESMI</h1>
        </div>
        <span class="text-xs bg-purple-600 px-2 py-1 rounded-full border border-purple-400">Modo Local</span>
    </header>

    <main id="content-area" class="flex-1 p-4 overflow-y-auto mb-16">
        
        <div id="view-balance" class="space-y-4">
            <div class="p-6 rounded-2xl bg-gradient-to-br from-purple-700 to-indigo-800 text-white shadow-xl">
                <p class="text-xs uppercase tracking-wider text-purple-200">Ganancia Neta del Mes</p>
                <h2 class="text-3xl font-black mt-1">$0.00</h2>
                
                <div class="grid grid-cols-2 gap-4 mt-6 pt-4 border-t border-purple-500/30">
                    <div>
                        <p class="text-xs text-purple-200">Total Ventas</p>
                        <p class="text-lg font-bold text-emerald-300">+$0.00</p>
                    </div>
                    <div>
                        <p class="text-xs text-purple-200">Inversión / Costos</p>
                        <p class="text-lg font-bold text-rose-300">-$0.00</p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button class="bg-purple-100 hover:bg-purple-200 text-purple-950 p-4 rounded-xl font-semibold text-sm flex flex-col items-center gap-2 border border-purple-200 transition-all active:scale-95">
                    <i data-lucide="plus-circle" class="text-purple-700"></i>
                    Nueva Venta
                </button>
                <button class="bg-fuchsia-100 hover:bg-fuchsia-200 text-fuchsia-950 p-4 rounded-xl font-semibold text-sm flex flex-col items-center gap-2 border border-fuchsia-200 transition-all active:scale-95">
                    <i data-lucide="package-plus" class="text-fuchsia-700"></i>
                    Armar Combo
                </button>
            </div>
        </div>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur-md border-t border-slate-200 h-16 flex justify-around items-center rounded-t-2xl shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
        <button class="flex flex-col items-center gap-1 text-purple-800 font-medium text-xs">
            <i data-lucide="wallet" class="w-5 h-5"></i>
            <span>Balance</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-slate-400 font-medium text-xs hover:text-purple-600">
            <i data-lucide="package" class="w-5 h-5"></i>
            <span>Inventario</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-slate-400 font-medium text-xs hover:text-purple-600">
            <i data-lucide="settings" class="w-5 h-5"></i>
            <span>Ajustes</span>
        </button>
    </nav>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>

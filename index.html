<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAESMI - Control de Negocio</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col justify-between max-w-md mx-auto shadow-2xl bg-white pb-16">

    <!-- ENCABEZADO / NAVBAR TOP -->
    <header class="bg-purple-800 text-white p-4 sticky top-0 z-40 shadow-md flex justify-between items-center rounded-b-2xl">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-purple-300 flex items-center justify-center text-purple-900 font-bold text-sm">D</div>
            <h1 class="text-xl font-bold tracking-wide">DAESMI</h1>
        </div>
        <span class="text-xs bg-purple-600 px-2 py-1 rounded-full border border-purple-400">Modo Local</span>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="content-area" class="flex-1 p-4 overflow-y-auto">
        
        <!-- PANTALLA 1: BALANCE -->
        <div id="view-balance" class="space-y-4">
            <div class="p-6 rounded-2xl bg-gradient-to-br from-purple-700 to-indigo-800 text-white shadow-xl">
                <p class="text-xs uppercase tracking-wider text-purple-200">Ganancia Neta del Mes</p>
                <h2 class="text-3xl font-black mt-1">$0.00</h2>
                
                <div class="grid grid-cols-2 gap-4 mt-6 pt-4 border-t border-purple-500/30">
                    <div>
                        <p class="text-xs text-purple-200">Total Ventas</p>
                        <p class="text-lg font-bold text-emerald-300">+$0.00</p>
                    </div>
                    <div>
                        <p class="text-xs text-purple-200">Inversión / Costos</p>
                        <p class="text-lg font-bold text-rose-300">-$0.00</p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button class="bg-purple-100 hover:bg-purple-200 text-purple-950 p-4 rounded-xl font-semibold text-sm flex flex-col items-center gap-2 border border-purple-200 transition-all active:scale-95 cursor-pointer">
                    <i data-lucide="plus-circle" class="text-purple-700"></i>
                    Nueva Venta
                </button>
                <button class="bg-fuchsia-100 hover:bg-fuchsia-200 text-fuchsia-950 p-4 rounded-xl font-semibold text-sm flex flex-col items-center gap-2 border border-fuchsia-200 transition-all active:scale-95 cursor-pointer">
                    <i data-lucide="package-plus" class="text-fuchsia-700"></i>
                    Armar Combo
                </button>
            </div>
        </div>

        <!-- PANTALLA 2: INVENTARIO -->
        <div id="view-inventario" class="space-y-4 hidden">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-purple-950">Mis Productos</h3>
                <button id="btn-nuevo-producto" class="bg-purple-700 hover:bg-purple-800 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 shadow cursor-pointer">
                    <i data-lucide="plus" class="w-3 h-3"></i> Nuevo Producto
                </button>
            </div>
            
            <!-- Aquí se inyecta la lista dinámica desde JS -->
            <div id="lista-inventario" class="space-y-3"></div>
        </div>

        <!-- PANTALLA 3: AJUSTES -->
        <div id="view-ajustes" class="space-y-4 hidden">
            <h3 class="text-lg font-bold text-purple-950">Configuración</h3>
            <div class="bg-white rounded-xl border border-slate-100 shadow-sm divide-y divide-slate-100">
                <div class="p-4 flex justify-between items-center">
                    <div>
                        <p class="font-semibold text-sm text-slate-700">Copia de Seguridad</p>
                        <p class="text-xs text-slate-400">Descarga tus datos locales</p>
                    </div>
                    <button class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer">
                        Exportar JSON
                    </button>
                </div>
                <div class="p-4 flex justify-between items-center">
                    <div>
                        <p class="font-semibold text-sm text-slate-700">Restaurar Datos</p>
                        <p class="text-xs text-slate-400">Sube tu archivo de respaldo</p>
                    </div>
                    <button class="bg-purple-50 hover:bg-purple-100 text-purple-700 px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer">
                        Importar JSON
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- INTERFAZ MODAL: REGISTRAR PRODUCTO SIMPLE -->
    <div id="modal-producto" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-150">
            <div class="bg-purple-800 text-white p-4 flex justify-between items-center">
                <h4 class="font-bold">Añadir Nuevo Producto</h4>
                <button id="btn-cerrar-modal-prod" class="text-purple-200 hover:text-white cursor-pointer">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="form-producto" class="p-4 space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nombre del Producto</label>
                    <input type="text" id="prod-nombre" required placeholder="Ej: Pestañina Lavable" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-purple-600">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Costo Unitario ($)</label>
                        <input type="number" id="prod-costo" required step="0.01" placeholder="7.00" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-purple-600">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Precio Venta ($)</label>
                        <input type="number" id="prod-precio" required step="0.01" placeholder="10.00" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-purple-600">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Cantidad en Stock</label>
                    <input type="number" id="prod-stock" required placeholder="12" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-purple-600">
                </div>
                <button type="submit" class="w-full bg-purple-700 hover:bg-purple-800 text-white font-bold py-2.5 rounded-lg text-sm mt-2 shadow cursor-pointer">
                    Guardar en Inventario
                </button>
            </form>
        </div>
    </div>

    <!-- MENÚ DE NAVEGACIÓN INFERIOR -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur-md border-t border-slate-200 h-16 flex justify-around items-center rounded-t-2xl shadow-[0_-4px_10px_rgba(0,0,0,0.05)] z-40">
        <button id="nav-balance" class="flex flex-col items-center gap-1 text-purple-800 font-medium text-xs w-full h-full justify-center cursor-pointer">
            <i data-lucide="wallet" class="w-5 h-5"></i>
            <span>Balance</span>
        </button>
        <button id="nav-inventario" class="flex flex-col items-center gap-1 text-slate-400 font-medium text-xs w-full h-full justify-center cursor-pointer">
            <i data-lucide="package" class="w-5 h-5"></i>
            <span>Inventario</span>
        </button>
        <button id="nav-ajustes" class="flex flex-col items-center gap-1 text-slate-400 font-medium text-xs w-full h-full justify-center cursor-pointer">
            <i data-lucide="settings" class="w-5 h-5"></i>
            <span>Ajustes</span>
        </button>
    </nav>

    <!-- ENLACE AL CEREBRO DE LA APP -->
    <script src="app.js"></script>

    <!-- Inicializar iconos -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>

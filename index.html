<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAESMI - Control de Negocio</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col justify-between max-w-md mx-auto shadow-2xl bg-white pb-16">

    <!-- ENCABEZADO / NAVBAR TOP -->
    <header class="bg-purple-800 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center rounded-b-2xl">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-purple-300 flex items-center justify-center text-purple-900 font-bold text-sm">D</div>
            <h1 class="text-xl font-bold tracking-wide">DAESMI</h1>
        </div>
        <span class="text-xs bg-purple-600 px-2 py-1 rounded-full border border-purple-400">Modo Local</span>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="content-area" class="flex-1 p-4 overflow-y-auto">
        
        <!-- PANTALLA 1: BALANCE -->
        <div id="view-balance" class="space-y-4">
            <!-- Tarjeta de Resumen Principal -->
            <div class="p-6 rounded-2xl bg-gradient-to-br from-purple-700 to-indigo-800 text-white shadow-xl">
                <p class="text-xs uppercase tracking-wider text-purple-200">Ganancia Neta del Mes</p>
                <h2 class="text-3xl font-black mt-1">$0.00</h2>
                
                <div class="grid grid-cols-2 gap-4 mt-6 pt-4 border-t border-purple-500/30">
                    <div>
                        <p class="text-xs text-purple-200">Total Ventas</p>
                        <p class="text-lg font-bold text-emerald-300">+$0.00</p>
                    </div>
                    <div>
                        <p class="text-xs text-purple-200">Inversión / Costos</p>
                        <p class="text-lg font-bold text-rose-300">-$0.00</p>
                    </div>
                </div>
            </div>

            <!-- Accesos Rápidos -->
            <div class="grid grid-cols-2 gap-3">
                <button class="bg-purple-100 hover:bg-purple-200 text-purple-950 p-4 rounded-xl font-semibold text-sm flex flex-col items-center gap-2 border border-purple-200 transition-all active:scale-95 cursor-pointer">
                    <i data-lucide="plus-circle" class="text-purple-700"></i>
                    Nueva Venta
                </button>
                <button class="bg-fuchsia-100 hover:bg-fuchsia-200 text-fuchsia-950 p-4 rounded-xl font-semibold text-sm flex flex-col items-center gap-2 border border-fuchsia-200 transition-all active:scale-95 cursor-pointer">
                    <i data-lucide="package-plus" class="text-fuchsia-700"></i>
                    Armar Combo
                </button>
            </div>
        </div>

        <!-- PANTALLA 2: INVENTARIO (Oculta por defecto con 'hidden') -->
        <div id="view-inventario" class="space-y-4 hidden">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-purple-950">Mis Productos y Combos</h3>
                <button class="bg-purple-700 hover:bg-purple-800 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 shadow cursor-pointer">
                    <i data-lucide="plus" class="w-3 h-3"></i> Nuevo Producto
                </button>
            </div>
            <!-- Lista vacía por ahora -->
            <div class="bg-white p-8 rounded-xl border border-slate-100 text-center text-slate-400 text-sm">
                <i data-lucide="box" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
                No hay productos en el inventario.
            </div>
        </div>

        <!-- PANTALLA 3: AJUSTES (Oculta por defecto con 'hidden') -->
        <div id="view-ajustes" class="space-y-4 hidden">
            <h3 class="text-lg font-bold text-purple-950">Configuración</h3>
            <div class="bg-white rounded-xl border border-slate-100 shadow-sm divide-y divide-slate-100">
                <div class="p-4 flex justify-between items-center">
                    <div>
                        <p class="font-semibold text-sm text-slate-700">Copia de Seguridad</p>
                        <p class="text-xs text-slate-400">Descarga tus datos locales</p>
                    </div>
                    <button class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer">
                        Exportar JSON
                    </button>
                </div>
                <div class="p-4 flex justify-between items-center">
                    <div>
                        <p class="font-semibold text-sm text-slate-700">Restaurar Datos</p>
                        <p class="text-xs text-slate-400">Sube tu archivo de respaldo</p>
                    </div>
                    <button class="bg-purple-50 hover:bg-purple-100 text-purple-700 px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer">
                        Importar JSON
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- MENÚ DE NAVEGACIÓN INFERIOR (Fijo con IDs para JS) -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur-md border-t border-slate-200 h-16 flex justify-around items-center rounded-t-2xl shadow-[0_-4px_10px_rgba(0,0,0,0.05)] z-50">
        <button id="nav-balance" class="flex flex-col items-center gap-1 text-purple-800 font-medium text-xs w-full h-full justify-center cursor-pointer">
            <i data-lucide="wallet" class="w-5 h-5"></i>
            <span>Balance</span>
        </button>
        <button id="nav-inventario" class="flex flex-col items-center gap-1 text-slate-400 font-medium text-xs w-full h-full justify-center cursor-pointer">
            <i data-lucide="package" class="w-5 h-5"></i>
            <span>Inventario</span>
        </button>
        <button id="nav-ajustes" class="flex flex-col items-center gap-1 text-slate-400 font-medium text-xs w-full h-full justify-center cursor-pointer">
            <i data-lucide="settings" class="w-5 h-5"></i>
            <span>Ajustes</span>
        </button>
    </nav>

    <!-- ENLACE AL CEREBRO DE LA APP -->
    <script src="app.js"></script>

    <!-- Inicializar iconos -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
